<app-header [showNavigation]="true"></app-header>

<div class="container py-5">

  <div class="d-flex justify-content-between align-items-center mb-4">

    <h2 class="mb-0">
        <i class="fa-solid fa-quote-left me-2 text-info"></i>
        Quotes
    </h2>

    <button
        class="btn btn-info text-white rounded-pill px-4"
        routerLink="/quotes/add">

        <i class="fa-solid fa-plus me-2"></i>

        Add Quote

    </button>

  </div>

  <hr>

  <div class="py-3">

    @if (quotes.length === 0) {
  
      <p class="text-secondary">
        No quotes yet.
      </p>
  
    } @else {
  
      @for (quote of quotes.slice(0, visibleCount); track quote.id) {

        <app-quote-card
          [quote]="quote"
          (delete)="deleteQuote($event)">
        </app-quote-card>
      
      }
      <div class="d-flex justify-content-center gap-2 mt-4">

        <button
          type="button"
          class="btn btn-outline-info"
          (click)="showMore()"
          [disabled]="visibleCount >= quotes.length">
      
          More
      
        </button>
      
        <button
          type="button"
          class="btn btn-outline-secondary"
          (click)="hideQuotes()"
          [disabled]="visibleCount <= 5">
      
          Hide
      
        </button>
      
      </div>
  
    }
  
  </div>

  <div class="text-end mt-5">

    <a
      routerLink="/home"
      class="text-decoration-none fw-semibold text-dark">

      <i class="fa-solid fa-arrow-left me-1"></i>
      My Books

    </a>

  </div>

</div>
